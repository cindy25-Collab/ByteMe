    <div class="container mt-4">
        <h2 class="text-custom">Administración de Cursos</h2>
        
        <div class="card p-4 mb-4 shadow-sm border-warning">
            <h5 id="form-titulo">Registrar Nuevo Curso</h5>
            <form id="form-curso">
                <input type="hidden" id="input-id-hidden">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Horario</label>
                        <input type="text" id="input-horario" class="form-control" placeholder="Ej: L-X 10:00" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Nivel</label>
                        <select id="select-nivel" class="form-select">
                            <option value="Básico">Básico</option>
                            <option value="Intermedio">Intermedio</option>
                            <option value="Avanzado">Avanzado</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Idioma</label>
                        <select id="select-idioma" class="form-select">
                            <option value="ESPAÑOL">ESPAÑOL</option>
                            <option value="EUSKERA">EUSKERA</option>
                            <option value="INGLÉS">INGLÉS</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label fw-bold">Programa</label>
                        <input type="text" id="input-programa" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">DNI Profe Responsable</label>
                        <input type="text" id="input-dni-profe" class="form-control" placeholder="12345678Z" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-warning">Guardar Curso</button>
                        <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">Cancelar</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="estado-mensaje" class="text-center my-3 fw-bold"></div>

        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Horario</th>
                        <th>Nivel</th>
                        <th>Idioma</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo"></tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/cursos.js"></script>
</body>
</html>
