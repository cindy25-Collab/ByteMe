<section id="Inscripcion" class="container my-5 p-4 bg-white shadow rounded">
    <h2 class="text-center mb-4 text-custom">Formulario de Inscripción</h2>
    <form id="registroForm" class="needs-validation" novalidate>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre completo:</label>
                <input type="text" class="form-control" id="nombre" required>
                <div class="invalid-feedback">Por favor, introduce tu nombre.</div>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Correo electrónico:</label>
                <input type="email" class="form-control" id="email" required placeholder="ejemplo@gmail.com">
            </div>
            <div class="col-md-6">
                <label for="telefono" class="form-label">Teléfono:</label>
                <input type="tel" class="form-control" id="telefono" pattern="[0-9]{9}" required>
            </div>
            <div class="col-md-6">
                <label for="nivel" class="form-label">Nivel actual:</label>
                <select id="nivel" class="form-select" required>
                    <option value="">--Selecciona tu nivel--</option>
                    <option value="principiante">Principiante</option>
                    <option value="intermedio">Intermedio</option>
                    <option value="avanzado">Avanzado</option>
                </select>
            </div>
            <div id="contenedorPrecio" class="col-12 d-none">
                <div class="alert alert-info fw-bold" id="textoPrecio"></div>
            </div>
            <div class="col-12">
                <label for="comentarios" class="form-label">Comentarios:</label>
                <textarea class="form-control" id="comentarios" rows="3"></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn text-white w-100 fw-bold bg-custom2">Enviar inscripción</button>
            </div>
        </div>
    </form>
</section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
