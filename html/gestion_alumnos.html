    <div class="container mt-4">
    <h2 class="text-custom">Administración de Alumnos</h2>
    
    
    <h5 id="form-titulo" class="mb-3">Registrar Nuevo Alumno</h5>
    <form id="form-alumno">
        <input type="hidden" id="input-dni-hidden">

        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label small fw-bold">DNI</label>
                <input type="text" id="input-dni-real" class="form-control" placeholder="12345678Z" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">Nombre</label>
                <input type="text" id="input-nombre" class="form-control" placeholder="Ej: Pepe" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">Apellidos</label>
                <input type="text" id="input-apellido" class="form-control" placeholder="Ej: Agirre" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">Email</label>
                <input type="email" id="input-email" class="form-control" placeholder="pepe@email.com" required>
            </div>

            <div class="col-md-3">
                <label class="form-label small fw-bold">Teléfono</label>
                <input type="number" id="input-tel" class="form-control" placeholder="600000000" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">Fec. Nacimiento</label>
                <input type="date" id="input-fecha" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Domicilio</label>
                <input type="text" id="input-domicilio" class="form-control" placeholder="Calle..." required>
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-bold">Cód. Postal</label>
                <input type="number" id="input-cp" class="form-control" placeholder="20000" required>
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold">Idioma Nativo</label>
                <input type="text" id="input-idioma" class="form-control" placeholder="Euskera, Castellano..." required>
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold">DNI Profesor Asignado</label>
                <input type="text" id="input-dni-profe" class="form-control" placeholder="DNI del tutor" required>
            </div>

            <div class="col-12 mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-warning px-4">Guardar Alumno</button>
                <button type="button" class="btn btn-secondary px-4" onclick="limpiarFormulario()">Cancelar</button>
            </div>
        </div>
    </form>
</div>
    <div id="estado-mensaje" class="text-center my-3 fw-bold"></div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo">
                </tbody>
        </table>
    </div>
</div>
