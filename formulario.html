<section id="Inscripcion">
  <h2>Formulario de Inscripción</h2>

  <form action="#" method="post" class="formulario">
    <label for="nombre">Nombre completo:</label>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="telefono">Teléfono:</label>
    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" placeholder="Ej: 600123456" required><br><br>

    <label for="idioma">Idioma nativo</label>
    <select id="idioma" name="idioma" required>
      <option value="">--Selecciona un idioma--</option>
      <option value="euskera">Euskera</option>
      <option value="ingles">Inglés</option>
      <option value="castellano">Castellano</option>
      <option value="algun otro">Algun otro</option>
    </select><br><br>

    <label for="nivel">Nivel actual:</label>
    <select id="nivel" name="nivel">
      <option value="">--Selecciona tu nivel--</option>
      <option value="principiante">Principiante</option>
      <option value="intermedio">Intermedio</option>
      <option value="avanzado">Avanzado</option>
    </select><br><br>

    <label for="comentarios">Comentarios adicionales:</label><br>
    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Cuéntanos tus objetivos o disponibilidad..."></textarea><br><br>

    <button type="submit">Enviar inscripción</button>
  </form>
</section>
</body>
</html>
